name: Piloto intento de identidad de check
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  checks: write

jobs:
  prueba_identidad:
    if: ${{ github.head_ref == 'piloto/prueba-origen-check-20261027' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probar si el mismo origen puede emitir un check homónimo
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.api_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          payload = {
              'name': 'Piloto / Politicas',
              'head_sha': os.environ['HEAD_SHA'],
              'status': 'completed',
              'conclusion': 'success',
              'details_url': os.environ['RUN_URL'],
              'output': {
                  'title': 'CONTROL NEGATIVO - NO CONFIABLE',
                  'summary': 'Check sintetico creado por workflow NO AUTORIZADO de una rama PR. NO equivale a politica aprobada. NO MERGE.'
              }
          }
          url = os.environ['SERVER'] + '/repos/' + os.environ['REPO'] + '/check-runs'
          req = Request(url, method='POST', data=json.dumps(payload).encode('utf-8'), headers={
              'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
              'User-Agent': 'nexus-piloto-check-identity-negative-test',
          })
          try:
              with urlopen(req, timeout=20) as response:
                  result = json.load(response)
                  print(json.dumps({
                      'TEST': 'CAN_EMIT_SAME_NAMED_CHECK',
                      'result': 'YES',
                      'check_run_id': result['id'],
                      'check_name': result['name'],
                      'head_sha': result['head_sha'],
                      'source': result.get('app', {}).get('slug')
                  }))
          except HTTPError as exc:
              print(json.dumps({'TEST': 'CAN_EMIT_SAME_NAMED_CHECK', 'result': 'REJECTED',
                                'http_code': exc.code}))
              raise SystemExit(1)
          PY
