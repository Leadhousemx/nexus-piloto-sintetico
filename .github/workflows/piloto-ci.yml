name: Piloto CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Piloto CI / Pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar sintaxis
        run: python -m compileall -q calculadora.py tests
      - name: Pruebas reales
        run: python -m unittest discover -s tests -p 'test_*.py' -v
